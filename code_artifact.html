<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>機器人模擬流程時間表</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Share+Tech+Mono&display=swap');
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      background-color: #f1f5f9;
    }
    .font-digital {
      font-family: 'Share Tech Mono', monospace, monospace;
    }
    .flash-active {
      animation: pulse-border 1.5s infinite;
    }
    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.5); }
      50% { box-shadow: 0 0 0 6px rgba(59, 130, 246, 0); }
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 pb-12">

  <!-- Header Banner -->
  <header class="bg-gradient-to-r from-blue-900 via-indigo-900 to-slate-900 text-white shadow-lg py-6 px-4">
    <div class="max-w-5xl mx-auto text-center">
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-wide flex items-center justify-center gap-3">
        <i class="fa-solid fa-stopwatch text-amber-400 animate-bounce"></i>
        <span>機器人模擬流程時間表</span>
      </h1>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

    <!-- Prominent TOP Display: Large Real-Time Digital Clock -->
    <div class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white rounded-2xl p-6 shadow-xl text-center border border-indigo-800/50 relative overflow-hidden">
      <!-- Background Ambient Glow -->
      <div class="absolute -top-10 -left-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex items-center justify-center gap-2 text-indigo-300 font-bold text-sm md:text-base tracking-widest uppercase mb-1">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
        <i class="fa-regular fa-clock text-indigo-400"></i>
        <span>現在時間 (REAL-TIME CLOCK)</span>
      </div>

      <!-- Extra Large Digital Clock -->
      <div id="current-clock" class="text-6xl sm:text-7xl md:text-8xl font-black font-digital text-amber-400 tracking-wider my-2 drop-shadow-[0_0_15px_rgba(251,191,36,0.3)]">
        --:--:--
      </div>

      <!-- Monitoring Status Indicator -->
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full text-xs sm:text-sm font-bold bg-white/10 backdrop-blur border border-white/10 mt-1">
        <span class="text-slate-300">監控狀態：</span>
        <div id="overall-status-badge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-700 text-slate-300">
          <span class="w-2 h-2 rounded-full bg-slate-400"></span>
          <span id="overall-status-text">未監控</span>
        </div>
      </div>
    </div>

    <!-- Top Time Summary Highlight Cards (Start & End Time) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-amber-100/90 border-2 border-amber-300 rounded-xl p-5 text-center shadow-sm relative overflow-hidden">
        <div class="text-slate-600 text-sm font-bold tracking-wider uppercase mb-1">開始時間</div>
        <div id="display-overall-start" class="text-5xl md:text-6xl font-black text-slate-800 tracking-tight font-mono">
          10:25
        </div>
        <div class="absolute top-3 right-3 text-amber-500 opacity-20 text-4xl">
          <i class="fa-solid fa-play"></i>
        </div>
      </div>

      <div class="bg-amber-100/90 border-2 border-amber-300 rounded-xl p-5 text-center shadow-sm relative overflow-hidden">
        <div class="text-slate-600 text-sm font-bold tracking-wider uppercase mb-1">結束時間</div>
        <div id="display-overall-end" class="text-5xl md:text-6xl font-black text-slate-800 tracking-tight font-mono">
          11:50
        </div>
        <div class="absolute top-3 right-3 text-amber-500 opacity-20 text-4xl">
          <i class="fa-solid fa-flag-checkered"></i>
        </div>
      </div>
    </div>

    <!-- Control Toolbar -->
    <div class="bg-white rounded-xl shadow-md p-4 md:p-5 flex flex-wrap items-center justify-between gap-4 border border-slate-200">
      
      <!-- Start Time Controls -->
      <div class="flex flex-wrap items-center gap-3">
        <div class="flex items-center gap-2 bg-slate-50 border border-slate-300 rounded-lg p-1.5">
          <label for="base-time-input" class="text-xs font-bold text-slate-600 whitespace-nowrap pl-1">
            <i class="fa-regular fa-clock text-indigo-600 mr-1"></i>設定開始時間
          </label>
          <input type="time" id="base-time-input" value="10:25" 
            class="bg-white border border-slate-300 rounded px-2 py-1 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          
          <!-- Requirement 1: One-click Set Current Time -->
          <button onclick="setCurrentTimeAsBase()" type="button"
            class="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-xs font-bold px-3 py-1.5 rounded transition shadow-sm whitespace-nowrap">
            <i class="fa-solid fa-bolt"></i>
            <span>一鍵設為現在時間</span>
          </button>
        </div>

        <!-- Monitoring Toggle Button & Pause Button -->
        <div class="flex items-center gap-2">
          <button id="toggle-monitor-btn" onclick="toggleMonitor()" 
            class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white px-4 py-2 rounded-lg font-bold shadow transition text-sm">
            <i class="fa-solid fa-play" id="monitor-icon"></i>
            <span id="monitor-btn-text">開啟實時提醒</span>
          </button>

          <!-- Pause/Resume Toggle Button -->
          <button id="toggle-pause-btn" onclick="togglePause()" disabled
            class="flex items-center gap-2 bg-slate-300 text-slate-500 cursor-not-allowed px-4 py-2 rounded-lg font-bold shadow transition text-sm">
            <i class="fa-solid fa-pause" id="pause-icon"></i>
            <span id="pause-btn-text">暫停</span>
          </button>
        </div>
      </div>

      <!-- Requirement 2: 5-Second Alarm Sound Toggle Switch & Sound Type Selector -->
      <div class="flex flex-wrap items-center gap-2 bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5">
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="sound-enable-toggle" class="sr-only peer" checked onchange="handleSoundToggleChange()">
          <div class="w-9 h-5 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600"></div>
        </label>
        <span class="text-xs font-bold text-slate-700 flex items-center gap-1">
          <i class="fa-solid fa-bell text-amber-500" id="sound-toggle-icon"></i>
          <span>提醒聲 (5秒)</span>
        </span>

        <!-- Sound Type Selector -->
        <select id="sound-type-select" class="bg-white border border-slate-300 rounded text-xs font-bold px-2 py-1 text-slate-700 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <option value="chime">🔔 經典清脆響鈴</option>
          <option value="beep">🤖 數位電子嗶聲</option>
          <option value="melody">🎶 柔和三音階</option>
          <option value="buzzer">⚠️ 警示蜂鳴聲</option>
        </select>

        <button onclick="play5SecChime(true)" type="button"
          class="ml-1 text-xs bg-amber-500 hover:bg-amber-600 active:bg-amber-700 text-white font-bold px-2.5 py-1 rounded transition shadow-sm"
          title="試聽5秒響鈴聲音">
          試聽5秒
        </button>
      </div>
    </div>

    <!-- Active Step Countdown Banner (When Running) -->
    <div id="active-step-banner" class="hidden bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl p-4 shadow-lg flex flex-wrap items-center justify-between gap-3 animate-fade-in">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center text-xl">
          <i class="fa-solid fa-hourglass-half animate-spin" style="animation-duration: 3s;"></i>
        </div>
        <div>
          <div class="text-xs text-blue-200 font-semibold">進行中步驟</div>
          <div id="active-step-title" class="text-xl font-bold">--</div>
        </div>
      </div>
      <div class="text-right">
        <div class="text-xs text-blue-200 font-semibold">倒數時間 / 剩餘</div>
        <div id="active-step-countdown" class="text-2xl md:text-3xl font-black font-mono tracking-wider">--:--</div>
      </div>
    </div>

    <!-- Main Schedule Table (Matching Image Style) -->
    <div class="bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-sky-900 text-white text-base md:text-lg divide-x divide-sky-800">
              <th class="py-3.5 px-4 font-bold text-center w-12">#</th>
              <th class="py-3.5 px-4 font-bold">步驟名稱</th>
              <th class="py-3.5 px-4 font-bold text-center">開始時間</th>
              <th class="py-3.5 px-4 font-bold text-center">結束時間</th>
              <th class="py-3.5 px-4 font-bold text-center">耗時 / 間隔</th>
              <th class="py-3.5 px-4 font-bold text-center w-32">狀態</th>
              <th class="py-3.5 px-4 font-bold text-center w-20">操作</th>
            </tr>
          </thead>
          <tbody id="schedule-tbody" class="divide-y divide-slate-200 text-base md:text-lg">
            <!-- Rows injected by JavaScript -->
          </tbody>
        </table>
      </div>

      <!-- Footer Action Area -->
      <div class="bg-slate-50 p-4 border-t border-slate-200 flex flex-wrap items-center justify-between gap-3 text-sm">
        <button onclick="addStepRow()" type="button" class="flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold border border-indigo-200 px-4 py-2 rounded-lg transition">
          <i class="fa-solid fa-plus"></i>
          <span>新增步驟</span>
        </button>
        <button onclick="resetDefaultSteps()" type="button" class="text-slate-500 hover:text-slate-800 underline font-medium">
          重置為預設流程
        </button>
      </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  </main>

  <script>
    // Initial Default Step Data
    const defaultSteps = [
      { name: '出題', duration: 10 },
      { name: '場地量測', duration: 5 },
      { name: '程式編輯', duration: 15 },
      { name: '第一次試跑', duration: 10 },
      { name: '程式編輯', duration: 10 },
      { name: '第二次試跑', duration: 10 },
      { name: '程式編輯', duration: 10 },
      { name: '檢錄', duration: 5 },
      { name: '評分', duration: 10 }
    ];

    let steps = JSON.parse(JSON.stringify(defaultSteps));
    let isMonitoring = false;
    let isPaused = false;
    let pauseStartTime = null;
    let isSoundEnabled = true;
    let audioCtx = null;
    let lastAlertStep = null;
    let activeChimeInterval = null;

    // Web Audio Sound Generator for 5-Second Chime
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function handleSoundToggleChange() {
      const toggle = document.getElementById('sound-enable-toggle');
      isSoundEnabled = toggle.checked;
      const icon = document.getElementById('sound-toggle-icon');
      if (isSoundEnabled) {
        icon.className = "fa-solid fa-bell text-amber-500";
        showToast("已開啟 5 秒提示音", "info");
      } else {
        icon.className = "fa-solid fa-bell-slash text-slate-400";
        showToast("已關閉提示音", "warning");
      }
    }

    function playSoundPulse(soundType) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;

        if (soundType === 'chime') {
          // 1. 經典清脆響鈴 (A5 -> E6)
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(1320, now + 0.15);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.38);

        } else if (soundType === 'beep') {
          // 2. 數位電子嗶聲 (雙嗶聲 1046Hz)
          [0, 0.12].forEach(offset => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(1046.5, now + offset); // C6
            gain.gain.setValueAtTime(0.15, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.09);
          });

        } else if (soundType === 'melody') {
          // 3. 柔和三音階 (C5 -> E5 -> G5)
          const freqs = [523.25, 659.25, 783.99];
          freqs.forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.1);
            gain.gain.setValueAtTime(0.25, now + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.1);
            osc.stop(now + idx * 0.1 + 0.28);
          });

        } else if (soundType === 'buzzer') {
          // 4. 警示蜂鳴聲 (低頻鋸齒波)
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(330, now + 0.15);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.38);
        }
      } catch (e) {
        console.error("Audio play error:", e);
      }
    }

    function play5SecChime(isTest = false) {
      if (!isSoundEnabled && !isTest) return;
      initAudio();

      if (activeChimeInterval) {
        clearInterval(activeChimeInterval);
        activeChimeInterval = null;
      }

      const soundSelect = document.getElementById('sound-type-select');
      const soundType = soundSelect ? soundSelect.value : 'chime';

      const startTime = Date.now();
      const chimeDuration = 5000;

      playSoundPulse(soundType);
      activeChimeInterval = setInterval(() => {
        if (Date.now() - startTime >= chimeDuration) {
          clearInterval(activeChimeInterval);
          activeChimeInterval = null;
        } else {
          playSoundPulse(soundType);
        }
      }, 650);

      if (isTest) {
        const typeText = soundSelect ? soundSelect.options[soundSelect.selectedIndex].text : '';
        showToast(`🔔 正在試聽 5 秒：${typeText}`, "info");
      }
    }

    // Helper: Parse time string "HH:MM" into Date object on today's date
    function parseTimeString(timeStr) {
      const now = new Date();
      if (!timeStr) return now;
      const [h, m] = timeStr.split(':').map(Number);
      return new Date(now.getFullYear(), now.getMonth(), now.getDate(), h || 0, m || 0, 0, 0);
    }

    // Helper: Format Date object to "HH:MM"
    function formatTimeHHMM(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      return `${h}:${m}`;
    }

    // Core Rendering Engine
    function renderTable() {
      const tbody = document.getElementById('schedule-tbody');
      if (!tbody) return;
      tbody.innerHTML = '';

      const baseInput = document.getElementById('base-time-input');
      let currentStartTime = parseTimeString(baseInput.value);

      const displayOverallStart = document.getElementById('display-overall-start');
      if (displayOverallStart) {
        displayOverallStart.textContent = formatTimeHHMM(currentStartTime);
      }

      const now = new Date();
      let activeStepFound = false;
      let activeStepIndex = -1;

      steps.forEach((step, idx) => {
        const stepStart = new Date(currentStartTime.getTime());
        const stepEnd = new Date(stepStart.getTime() + step.duration * 60000);

        // Next step start time = current step end time
        currentStartTime = new Date(stepEnd.getTime());

        // Check active status during monitoring
        let statusBadgeHTML = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-600">等待中</span>`;
        let isCurrent = false;

        if (isMonitoring && !isPaused) {
          if (now >= stepStart && now < stepEnd) {
            statusBadgeHTML = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500 text-white animate-pulse"><i class="fa-solid fa-spinner fa-spin mr-1"></i>進行中</span>`;
            isCurrent = true;
            activeStepFound = true;
            activeStepIndex = idx;

            // Trigger chime alert on entering new step
            if (lastAlertStep !== idx) {
              lastAlertStep = idx;
              play5SecChime();
              showToast(`🔔 步驟「${step.name}」已開始！`, "alert");
            }

            // Update banner
            const remainingSecs = Math.max(0, Math.floor((stepEnd.getTime() - now.getTime()) / 1000));
            const remM = String(Math.floor(remainingSecs / 60)).padStart(2, '0');
            const remS = String(remainingSecs % 60).padStart(2, '0');

            const activeBanner = document.getElementById('active-step-banner');
            const activeTitle = document.getElementById('active-step-title');
            const activeCountdown = document.getElementById('active-step-countdown');
            if (activeBanner && activeTitle && activeCountdown) {
              activeBanner.classList.remove('hidden');
              activeTitle.textContent = `${idx + 1}. ${step.name}`;
              activeCountdown.textContent = `${remM}:${remS}`;
            }
          } else if (now >= stepEnd) {
            statusBadgeHTML = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800"><i class="fa-solid fa-check mr-1"></i>已完成</span>`;
          }
        }

        const tr = document.createElement('tr');
        tr.className = isCurrent 
          ? "bg-amber-50/80 font-semibold border-l-4 border-amber-500 flash-active transition-all" 
          : "hover:bg-slate-50 transition-colors";

        tr.innerHTML = `
          <td class="py-3 px-4 text-center font-bold text-slate-400 text-sm">${idx + 1}</td>
          <td class="py-3 px-4 font-bold text-slate-800">
            <input type="text" value="${escapeHtml(step.name)}" onchange="updateStepName(${idx}, this.value)" 
              class="w-full bg-transparent border-b border-transparent hover:border-slate-300 focus:border-indigo-500 focus:bg-white focus:outline-none rounded px-1.5 py-0.5 transition">
          </td>
          <td class="py-3 px-4 text-center font-mono font-bold text-slate-700">${formatTimeHHMM(stepStart)}</td>
          <td class="py-3 px-4 text-center font-mono font-bold text-slate-700">${formatTimeHHMM(stepEnd)}</td>
          <td class="py-3 px-4 text-center">
            <div class="inline-flex items-center justify-center gap-1">
              <input type="number" min="1" max="180" value="${step.duration}" onchange="updateStepDuration(${idx}, this.value)" 
                class="w-16 text-center bg-white border border-slate-300 rounded px-1 py-0.5 font-mono text-sm font-bold text-indigo-600 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
              <span class="text-xs text-slate-500">分鐘</span>
            </div>
          </td>
          <td class="py-3 px-4 text-center">${statusBadgeHTML}</td>
          <td class="py-3 px-4 text-center">
            <button onclick="removeStepRow(${idx})" type="button" class="text-rose-500 hover:text-rose-700 p-1 rounded transition" title="刪除步驟">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Update Overall End Time
      const displayOverallEnd = document.getElementById('display-overall-end');
      if (displayOverallEnd) {
        displayOverallEnd.textContent = formatTimeHHMM(currentStartTime);
      }

      // Hide Banner if no active step
      if (!activeStepFound) {
        const activeBanner = document.getElementById('active-step-banner');
        if (activeBanner) activeBanner.classList.add('hidden');
      }
    }

    // Requirement 1: One-click Set Current Time
    function setCurrentTimeAsBase() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const baseInput = document.getElementById('base-time-input');
      if (baseInput) {
        baseInput.value = `${h}:${m}`;
        renderTable();
        showToast(`⚡ 已將開始時間設為現在時間 (${h}:${m})`, "info");
      }
    }

    // Step Row Operations
    function updateStepName(idx, newName) {
      if (steps[idx]) {
        steps[idx].name = newName;
      }
    }

    function updateStepDuration(idx, newDuration) {
      const val = parseInt(newDuration, 10);
      if (steps[idx] && !isNaN(val) && val > 0) {
        steps[idx].duration = val;
        renderTable();
      }
    }

    function addStepRow() {
      steps.push({ name: `新步驟 ${steps.length + 1}`, duration: 10 });
      renderTable();
      showToast("已新增一個步驟", "info");
    }

    function removeStepRow(idx) {
      if (steps.length <= 1) {
        showToast("至少需要保留一個步驟！", "warning");
        return;
      }
      steps.splice(idx, 1);
      renderTable();
      showToast("已刪除該步驟", "info");
    }

    // Clock and Monitoring Logic
    function updateClock() {
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
      const clockElem = document.getElementById('current-clock');
      if (clockElem) {
        clockElem.textContent = timeStr;
      }

      if (isMonitoring && !isPaused) {
        renderTable();
      }
    }

    function togglePause() {
      if (!isMonitoring) return;

      const pauseBtn = document.getElementById('toggle-pause-btn');
      const pauseIcon = document.getElementById('pause-icon');
      const pauseText = document.getElementById('pause-btn-text');
      const badgeText = document.getElementById('overall-status-text');
      const badge = document.getElementById('overall-status-badge');

      if (!isPaused) {
        // Switch to Paused state
        isPaused = true;
        pauseStartTime = new Date();

        if (pauseBtn) pauseBtn.className = "flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg font-bold shadow transition text-sm animate-pulse";
        if (pauseIcon) pauseIcon.className = "fa-solid fa-play";
        if (pauseText) pauseText.textContent = "恢復接續";

        if (badge) badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500 text-white";
        if (badgeText) badgeText.innerHTML = `<span class="w-2 h-2 rounded-full bg-white"></span> 已暫停`;

        showToast("⏸️ 流程已暫停，計時凍結中", "warning");
      } else {
        // Resume from Paused state
        if (pauseStartTime) {
          const now = new Date();
          const pausedDurationMs = now.getTime() - pauseStartTime.getTime();

          const baseInput = document.getElementById('base-time-input');
          if (baseInput) {
            const currentBase = parseTimeString(baseInput.value);
            const newBase = new Date(currentBase.getTime() + pausedDurationMs);

            const newH = String(newBase.getHours()).padStart(2, '0');
            const newM = String(newBase.getMinutes()).padStart(2, '0');
            baseInput.value = `${newH}:${newM}`;
          }

          const pauseSecs = Math.round(pausedDurationMs / 1000);
          showToast(`▶️ 已恢復流程！自動延後開始時間 ${pauseSecs} 秒`, "info");
        }

        isPaused = false;
        pauseStartTime = null;

        if (pauseBtn) pauseBtn.className = "flex items-center gap-2 bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg font-bold shadow transition text-sm";
        if (pauseIcon) pauseIcon.className = "fa-solid fa-pause";
        if (pauseText) pauseText.textContent = "暫停";

        if (badge) badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500 text-white";
        if (badgeText) badgeText.innerHTML = `<span class="w-2 h-2 rounded-full bg-white animate-ping"></span> 實時監控中`;
      }

      renderTable();
    }

    function toggleMonitor() {
      initAudio();
      isMonitoring = !isMonitoring;
      const btnText = document.getElementById('monitor-btn-text');
      const icon = document.getElementById('monitor-icon');
      const btn = document.getElementById('toggle-monitor-btn');
      const badgeText = document.getElementById('overall-status-text');
      const badge = document.getElementById('overall-status-badge');
      const pauseBtn = document.getElementById('toggle-pause-btn');

      if (isMonitoring) {
        if (btnText) btnText.textContent = "停止實時監控";
        if (icon) icon.className = "fa-solid fa-stop";
        if (btn) btn.className = "flex items-center gap-2 bg-rose-600 hover:bg-rose-700 active:bg-rose-800 text-white px-4 py-2 rounded-lg font-bold shadow transition text-sm";
        
        if (badge) badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500 text-white";
        if (badgeText) badgeText.innerHTML = `<span class="w-2 h-2 rounded-full bg-white animate-ping"></span> 實時監控中`;

        // Enable Pause Button
        if (pauseBtn) {
          pauseBtn.disabled = false;
          pauseBtn.className = "flex items-center gap-2 bg-amber-600 hover:bg-amber-700 active:bg-amber-800 text-white px-4 py-2 rounded-lg font-bold shadow transition text-sm cursor-pointer";
        }
        
        showToast("已啟動流程實時監控與 5 秒響鈴提醒", "info");
      } else {
        if (btnText) btnText.textContent = "開啟實時提醒";
        if (icon) icon.className = "fa-solid fa-play";
        if (btn) btn.className = "flex items-center gap-2 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white px-4 py-2 rounded-lg font-bold shadow transition text-sm";

        if (badge) badge.className = "inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-700 text-slate-300";
        if (badgeText) badgeText.textContent = "未監控";

        // Reset and Disable Pause Button
        isPaused = false;
        pauseStartTime = null;
        if (pauseBtn) {
          pauseBtn.disabled = true;
          pauseBtn.className = "flex items-center gap-2 bg-slate-300 text-slate-500 cursor-not-allowed px-4 py-2 rounded-lg font-bold shadow transition text-sm";
        }
        const pauseText = document.getElementById('pause-btn-text');
        const pauseIcon = document.getElementById('pause-icon');
        if (pauseText) pauseText.textContent = "暫停";
        if (pauseIcon) pauseIcon.className = "fa-solid fa-pause";

        lastAlertStep = null;
      }
      renderTable();
    }

    function resetDefaultSteps() {
      steps = JSON.parse(JSON.stringify(defaultSteps));
      const baseInput = document.getElementById('base-time-input');
      if (baseInput) baseInput.value = '10:25';
      renderTable();
      showToast("已重置為預設流程時間表", "info");
    }

    // Toast Notification UI
    function showToast(message, type = "info") {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      
      let bgColor = "bg-slate-800 text-white";
      if (type === "alert") bgColor = "bg-indigo-600 text-white border border-indigo-400";
      if (type === "warning") bgColor = "bg-amber-600 text-white";

      toast.className = `pointer-events-auto px-4 py-3 rounded-lg shadow-xl font-bold text-sm flex items-center gap-2 transform transition-all duration-300 translate-y-4 opacity-0 ${bgColor}`;
      toast.innerHTML = `<span>${message}</span>`;

      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    // Initialize application when DOM is ready
    window.addEventListener('DOMContentLoaded', () => {
      renderTable();
      updateClock();
      setInterval(updateClock, 1000);

      const baseInput = document.getElementById('base-time-input');
      if (baseInput) {
        baseInput.addEventListener('input', () => {
          renderTable();
        });
      }
    });
  </script>
</body>
</html>
